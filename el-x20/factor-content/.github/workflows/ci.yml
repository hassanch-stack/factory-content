name: CI

on: [push, pull_request]

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factor
          POSTGRES_PASSWORD: factor_dev_password
          POSTGRES_DB: factor_content_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Run migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://factor:factor_dev_password@localhost:5432/factor_content_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: test
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          AUTH_SECRET: test
          ENCRYPTION_KEY: test
        run: alembic upgrade head
      - name: Run tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://factor:factor_dev_password@localhost:5432/factor_content_test
          REDIS_URL: redis://localhost:6379/0
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: test
          S3_ACCESS_KEY: test
          S3_SECRET_KEY: test
          AUTH_SECRET: test
          ENCRYPTION_KEY: test
        run: pytest
      - name: Lint
        working-directory: apps/api
        run: ruff check . && mypy app

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: apps/web
        run: npm install && npm run build
