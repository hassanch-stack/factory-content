[project]
name = "factor-content-api"
version = "0.1.0"
description = "Factor Content — Content Operating System (API)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "celery>=5.4",
    "redis>=5.0",
    "boto3>=1.34",
    "sentry-sdk[fastapi]>=2.10",
    "python-json-logger>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "Pillow>=10.4",
    "anthropic>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
